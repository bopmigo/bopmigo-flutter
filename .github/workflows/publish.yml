# Publishes to pub.dev when a version tag (v1.2.3) is pushed.
# Needs "Automated publishing from GitHub Actions" enabled for this repo
# on the package's pub.dev admin page (tag pattern v{{version}}).
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Sets up the pub.dev OIDC token for this run.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force
