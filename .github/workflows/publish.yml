# Publishes to pub.dev when a version tag (v1.2.3) is pushed.
# Needs "Automated publishing from GitHub Actions" enabled for this repo
# on the package's pub.dev admin page.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
